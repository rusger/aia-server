# Deploy as /etc/nginx/conf.d/request-timing.conf (http context).
#
# 'combined' plus request size and timing, appended AFTER the user-agent so
# every existing parser of access.log ($9 = status, etc.) keeps working.
#   rl  = $request_length        bytes received from the client (headers+body)
#   rt  = $request_time          seconds from first byte in to last byte out
#   urt = $upstream_response_time seconds the Go server took ('-' if never reached)
#
# Why: 2026-09-15 — chat POSTs (20-35 KB) from a few RU networks died as nginx
# 408 (body never arrived within client_body_timeout 60s) while the same phones'
# small astrolog POSTs passed. Without rl= the size threshold is guesswork; with
# it, astrolytix_chat_transport (mcp-server) reports request_body_bytes directly.
log_format timing '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rl=$request_length rt=$request_time urt=$upstream_response_time';
